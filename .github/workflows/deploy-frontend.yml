name: Deploy Frontend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MEDIAPIPE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite
          VITE_ENABLE_VIDEO_ANALYSIS: true
          VITE_ENABLE_AUDIO_PLAYBACK: true
          VITE_ENABLE_DARK_MODE: true
          VITE_APP_NAME: SpeakAssess
          VITE_APP_VERSION: 1.0.0
        run: |
          echo "DEBUG: VITE_SUPABASE_URL length is ${#VITE_SUPABASE_URL}"
          echo "DEBUG: VITE_SUPABASE_ANON_KEY length is ${#VITE_SUPABASE_ANON_KEY}"
          npm run build
          echo "DEBUG: Checking if supabase URL made it into the build..."
          grep -rl "supabase.co" dist/assets/*.js && echo "DEBUG: FOUND in build bundle" || echo "DEBUG: NOT FOUND in build bundle"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare deployment package
        working-directory: ./frontend
        run: |
          # Copy server file to dist
          cp server.js dist/
          
          # Create minimal package.json for production server
          cat > dist/package.json << 'EOF'
          {
            "name": "softskillcheck-frontend",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.21.0"
            }
          }
          EOF
          
          # Install production dependencies
          cd dist
          npm install --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_FRONTEND }}
          package: ./frontend/dist