name: Build and deploy Node.js app to Azure Web App - hd-English-Assessment-frontend-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1333284E7F1240B7AD2655E0AA96594F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CB1D41D44B514762A183A6844BDFE470 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F8AF618C1DEC489A9B303771D2F0A6BE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hd-English-Assessment-frontend-app'
          slot-name: 'Production'
          package: './frontend'
