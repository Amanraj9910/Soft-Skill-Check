# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - hd-English-Assisment-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: englishassistant-ctgrgwd5dbhsgwh0.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2EBF6930C869422B93B19DC29B0D9A8F }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_1988064802F54AEC89330673C6F284DE }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: englishassistant-ctgrgwd5dbhsgwh0.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2EBF6930C869422B93B19DC29B0D9A8F }}/latest:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E2C28A8C56DD40A2B6396C48D485504E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C7DAC4D22E0D42339587A996957E1481 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_56A1DB0C77DE4E60896C78617F54755E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'hd-English-Assisment-frontend'
          slot-name: 'Production'
          images: 'englishassistant-ctgrgwd5dbhsgwh0.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_2EBF6930C869422B93B19DC29B0D9A8F }}/latest:${{ github.sha }}'
          