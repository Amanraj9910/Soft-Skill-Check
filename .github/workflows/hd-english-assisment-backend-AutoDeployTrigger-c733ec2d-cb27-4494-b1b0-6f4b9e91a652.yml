name: Trigger auto deployment for hd-english-assisment-backend

# When this action will be executed
on:
  # Only redeploy the backend when backend code (or this workflow) changes.
  # This used to be '**', so every frontend-only commit rebuilt the backend.
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/hd-english-assisment-backend-AutoDeployTrigger-c733ec2d-cb27-4494-b1b0-6f4b9e91a652.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HDENGLISHASSISMENTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HDENGLISHASSISMENTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HDENGLISHASSISMENTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          # Build backend/ with its own Dockerfile. Previously this pointed at the
          # repo root with unsubstituted '_dockerfilePathKey_' placeholders, so the
          # action found no Dockerfile and fell back to the Oryx Node buildpack --
          # producing an image with no server in it (crash loop on '/workspace').
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          targetPort: 8000
          registryUrl: englishassistant-ctgrgwd5dbhsgwh0.azurecr.io
          registryUsername: ${{ secrets.HDENGLISHASSISMENTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HDENGLISHASSISMENTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: hd-english-assisment-backend
          resourceGroup: rg_hd_interview_assistence
          imageToBuild: englishassistant-ctgrgwd5dbhsgwh0.azurecr.io/hd-english-assisment-backend:${{ github.sha }}
